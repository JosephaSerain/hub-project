name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4              # récupère le code du dépôt
      - uses: pnpm/action-setup@v4             # installe pnpm (version lue dans package.json)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm                          # cache des dépendances : CI plus rapide
      - run: pnpm install --frozen-lockfile    # installation stricte depuis le lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
